name: CI Check

on:
    pull_request:
        branches: [ "*" ]
    push:
        branches: [ "main" ]

jobs:
    lint:
        runs-on: ubuntu-latest
        name: Lint
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - run: cp .env.example .env.local

            - run: bun run lint

    format:
        runs-on: ubuntu-latest
        name: Format
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - run: cp .env.example .env.local

            - run: bun run check

    tsc:
        runs-on: ubuntu-latest
        name: Typecheck
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - run: cp .env.example .env.local

            - run: bun run typecheck
